[package]
name = "loci-experiment"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
default-run = "loci-experiment"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "loci-service"
path = "src/bin/loci-service.rs"

[[bin]]
name = "loci"
path = "src/bin/loci.rs"

[[bin]]
name = "kite-plugin-loci"
path = "plugin/src/main.rs"

# Isolated from Kite; this experiment makes no standalone license decision.
[workspace]

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
