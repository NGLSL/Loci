name: Native engine

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust 1.99
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Fetch locked dependencies
        run: cargo +1.99.0 fetch --locked
      - name: Environment
        run: |
          git rev-parse HEAD
          rustc +1.99.0 -Vv
          Get-Volume -DriveLetter ([System.IO.Path]::GetPathRoot($PWD.Path).Substring(0, 1)) | Select-Object DriveLetter, FileSystem
      - name: Format and all targets
        run: |
          cargo +1.99.0 fmt --check
          cargo +1.99.0 check --all-targets --offline --locked
      - name: Windows debug suite
        run: cargo +1.99.0 test --offline --locked -- --test-threads=1
      - name: Windows release suite
        run: cargo +1.99.0 test --release --offline --locked -- --test-threads=1
